# GitHub Pages へ自動デプロイするワークフロー。
#
# 仕組み（学習メモ）:
#   - main ブランチに push されるたびに発火する。
#   - build ジョブで Vite を本番ビルドし、出来上がった dist/ を「Pages 用の成果物」として上げる。
#   - deploy ジョブがその成果物を GitHub Pages に公開する。
#   - これにより「dist/ をコミットせずに」公開できる（dist/ は .gitignore のまま）。
#
# 事前にブラウザ操作が 1 度だけ必要:
#   リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」に設定する。以降は push するだけで自動デプロイされる。

name: Deploy to GitHub Pages

on:
  # main への push で自動実行
  push:
    branches: [main]
  # Actions タブから手動実行もできるようにする
  workflow_dispatch:

# GITHUB_TOKEN に Pages へデプロイする権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数デプロイが走らないよう直列化する（途中のものはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Vite は import.meta.env.VITE_* を「ビルド時」に静的に埋め込む。
        # ローカルの .env.local は Git に含めない（gitignore）ため CI には存在しない。
        # そこで GitHub Secrets に登録した値を env として注入し、ビルドに焼き込む。
        #   - この 2 変数は Publishable key（公開前提）と URL なので、公開バンドルに
        #     含まれること自体は設計通り（守りは Supabase の RLS）。
        #   - Secrets を使う狙いは秘匿ではなく「ソース直書きの回避・値の一元管理」。
        #   - 未登録だと空文字になり、supabaseClient.js のフォールバック（ダミー値）が入る。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Vite の出力ディレクトリ
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
